[project]
name = "eld-backend"
version = "0.1.0"
description = "ELD trip planner API: HOS-compliant trip plans, routes and FMCSA daily logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9",
    "djangorestframework>=3.18",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
