[project]
name = "eld-backend"
version = "0.1.0"
description = "ELD trip planner API: HOS-compliant trip plans, routes and FMCSA daily logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9",
    "djangorestframework>=3.18",
    "requests>=2.32",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# DTZ is deliberately not selected: plans use naive local home-terminal time
# (no time-zone conversion; see the assumptions in trips/hos/logs.py).

[tool.ruff.lint.per-file-ignores]
# Tests keep wide fixture tables on one line and zip same-length literals.
"**/tests/**" = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["config", "trips"]
